name: Build protected wheels with Stonefish
description: >
  Build Stonefish-protected wheels of a Python project, one per Python version,
  and check that every wheel is protected.
author: Stonefish

inputs:
  license-key:
    description: >
      Stonefish license key that lists the project's name. Pass it from a
      repository secret. If empty, the STONEFISH_LICENSE_KEY environment
      variable is used.
    required: false
    default: ""
  python-versions:
    description: >
      Space-separated Python versions to build wheels for. Protected wheels
      contain interpreter-specific bytecode, so each version needs its own
      wheel. If empty, every supported version (3.9 to 3.15) that the
      project's requires-python admits.
    required: false
    default: ""
  package-dir:
    description: Directory of the project to build (the one with pyproject.toml).
    required: false
    default: "."
  output-dir:
    description: Directory the wheels are written to.
    required: false
    default: "dist"
  secret:
    description: >
      Optional module-encryption secret as a hex string. Requires a bootstrap
      ([tool.stonefish] bootstrap in pyproject.toml) whose
      unlock(*, build_date) returns the same bytes at import time.
    required: false
    default: ""

outputs:
  wheels:
    description: Newline-separated paths of the built wheels.
    value: ${{ steps.build.outputs.wheels }}

runs:
  using: composite
  steps:
    # setup-uv publishes no floating major tags after v7; pin a commit.
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - id: build
      shell: bash
      env:
        STONEFISH_LICENSE_KEY: ${{ inputs.license-key || env.STONEFISH_LICENSE_KEY }}
        SF_PYTHON_VERSIONS: ${{ inputs.python-versions }}
        SF_PACKAGE_DIR: ${{ inputs.package-dir }}
        SF_OUTPUT_DIR: ${{ inputs.output-dir }}
        SF_SECRET: ${{ inputs.secret }}
      run: |
        set -euo pipefail

        if [ -z "$STONEFISH_LICENSE_KEY" ]; then
          echo "::error::No Stonefish license. Set the license-key input (e.g. from secrets.STONEFISH_LICENSE_KEY)."
          exit 1
        fi
        if [ -n "$SF_SECRET" ]; then
          echo "::add-mask::$SF_SECRET"
        fi

        # On Windows, use C:/... paths so that later steps outside of Git
        # Bash can use the `wheels` output.
        native() {
          if command -v cygpath > /dev/null 2>&1; then cygpath -m "$1"; else printf '%s\n' "$1"; fi
        }

        mkdir -p "$SF_OUTPUT_DIR"
        out="$(native "$(cd "$SF_OUTPUT_DIR" && pwd)")"
        tmp="$(native "$RUNNER_TEMP")"

        # By default, build for every supported Python the project admits:
        # stonefish refuses to build for one its requires-python rules out.
        if [ -z "${SF_PYTHON_VERSIONS//[[:space:]]/}" ]; then
          SF_PYTHON_VERSIONS="$(uv run --no-project --isolated --quiet --python ">=3.11" --with packaging python -I - <<'PY'
        import os
        import sys
        import tomllib

        from packaging.specifiers import SpecifierSet

        supported = ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        path = os.path.join(os.environ["SF_PACKAGE_DIR"], "pyproject.toml")
        with open(path, "rb") as f:
            spec = tomllib.load(f).get("project", {}).get("requires-python")
        if spec is None:
            print(
                "::warning::No static [project] requires-python in pyproject.toml; "
                "building for all supported Pythons. Set python-versions to choose.",
                file=sys.stderr,
            )
            print(*supported)
            sys.exit()
        # A minor version qualifies if any of its releases does (pip checks
        # major.minor.micro).
        specifiers = SpecifierSet(spec)
        admitted = [
            v for v in supported
            if any(specifiers.contains(f"{v}.{micro}", prereleases=True) for micro in range(100))
        ]
        if not admitted:
            sys.exit(
                f"::error::requires-python {spec!r} admits none of the supported "
                f"Pythons {', '.join(supported)}."
            )
        print(*admitted)
        PY
          )"
        fi
        echo "Building for Python $SF_PYTHON_VERSIONS"

        # Resolve the project's stonefish requirement once, so that the build
        # backend and the checker are the same version. A pin goes in the
        # project's [build-system] requires, where local builds see it too.
        requirement="$(uv run --no-project --isolated --quiet --python ">=3.11" --with packaging python -I - <<'PY'
        import os
        import sys
        import tomllib

        from packaging.requirements import Requirement
        from packaging.utils import canonicalize_name

        path = os.path.join(os.environ["SF_PACKAGE_DIR"], "pyproject.toml")
        with open(path, "rb") as f:
            requires = tomllib.load(f).get("build-system", {}).get("requires", [])
        for r in map(Requirement, requires):
            if canonicalize_name(r.name) == "stonefish":
                print(r)
                break
        else:
            sys.exit(
                f"::error::{path} doesn't list stonefish in [build-system] requires. "
                'Use the stonefish build backend: requires = ["stonefish"], '
                'build-backend = "stonefish.build_meta".'
            )
        PY
        )"
        pin="$(echo "$requirement" | uv pip compile - --no-deps --no-header --no-annotate --quiet)"
        echo "Using $pin"
        constraints="$tmp/stonefish-constraints.txt"
        echo "$pin" > "$constraints"

        # Build into a fresh directory so that only this run's wheels are
        # checked and reported, not whatever already is in the output dir.
        staging="$tmp/stonefish-wheels"
        rm -rf "$staging"
        mkdir -p "$staging"

        args=(--wheel --out-dir "$staging" --build-constraint "$constraints")
        if [ -n "$SF_SECRET" ]; then
          args+=(--config-setting "secret=$SF_SECRET")
        fi

        for v in $SF_PYTHON_VERSIONS; do
          echo "::group::Build wheel for Python $v"
          uv build --python "$v" "${args[@]}" "$SF_PACKAGE_DIR"
          echo "::endgroup::"
        done

        echo "::group::Check that all wheels are protected"
        status=0
        uvx --from "$pin" stonefish check-wheel "$staging" 2>&1 | tee "$tmp/stonefish-check.txt" || status=$?
        echo "::endgroup::"

        # Summarize on the run page, also when the check fails, so that it
        # shows which wheel is unprotected.
        {
          echo "### Stonefish"
          echo
          echo "Built with \`$pin\` for Python $SF_PYTHON_VERSIONS."
          echo
          echo '```'
          sed "s|$staging[/\\\\]||" "$tmp/stonefish-check.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "$status" -ne 0 ]; then
          exit "$status"
        fi

        wheels=()
        for whl in "$staging"/*.whl; do
          cp -f "$whl" "$out/"
          wheels+=("$out/$(basename "$whl")")
        done

        {
          echo "wheels<<EOF"
          printf '%s\n' "${wheels[@]}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
